/* Fixed tablet geometry: equal action/image insets and a denser gallery. */
.hero{grid-template-rows:64px minmax(0,1fr);gap:20px;padding:20px}

#stories{grid-template-rows:56px minmax(0,1fr);gap:24px}

 -webkit-mask-size:100% 100%;

   for(const entry of snapshots)entry.node.inert=true;

const imageDecodeCache21=new Map();

 if(imageDecodeCache21.has(source))return imageDecodeCache21.get(source);
 const pending=new Promise(resolve=>{
  const image=new Image();let settled=false;
  const finish=success=>{if(settled)return;settled=true;clearTimeout(timer);if(!success)imageDecodeCache21.delete(source);resolve();};
  const timer=setTimeout(()=>finish(false),8000);
  image.onload=()=>{if(typeof image.decode==='function')image.decode().then(()=>finish(true),()=>finish(true));else finish(true);};
  image.onerror=()=>finish(false);image.decoding='async';image.src=source;
  if(image.complete&&image.naturalWidth)image.onload();
 });
 imageDecodeCache21.set(source,pending);return pending;
}

 turtle:{scene:'차곡이의 차례가 끝나기 전에 블록을 얹고 싶은 장면을 다룹니다. 아이가 서둘러 손을 뻗자 탑이 기울고, 함께 만들던 친구의 표정도 달라집니다. 그제야 주인공은 하고 싶은 마음과 친구의 차례를 함께 살펴보게 됩니다.',bridge:'동화는 기다림을 잘했는지 묻기 전에, 빨리 하고 싶었던 순간을 충분히 보여줍니다. 손을 잠깐 멈추기, 내 마음을 말하기, 차례를 부탁하기를 이야기 안에서 비교해 볼 수 있습니다.',practice:'놀이 순서를 정하는 순간에 아이가 동화에서 고른 방법을 다시 떠올려 보세요. 바로 기다리게 하기보다 먼저 무엇을 해보고 싶었는지 듣고, 다음 차례를 어떻게 알면 편할지 함께 정하면 이야기가 실제 놀이로 이어집니다.',question:'“기다리는 동안 내가 해볼 수 있는 일은 무엇일까?”',branches:['차례를 기다리겠다는 답변을 골랐습니다. 이제 기다리는 동안 무엇이 도움이 되는지 구체적으로 묻는 대화로 이어갈 수 있습니다. 숨을 쉬기, 완성된 모양을 바라보기처럼 아이가 해볼 수 있는 행동을 하나 골라보세요.','하고 싶은 마음을 말하겠다는 답변을 골랐습니다. “나도 해보고 싶어” 다음에 어떤 부탁을 덧붙이면 친구가 이해하기 쉬울지 함께 말해보세요. 마음을 전한 뒤 친구의 대답을 기다리는 순간까지 이어가 보는 것이 이 장면의 다음 연습입니다.','블록을 먼저 가져오겠다는 답변을 골랐습니다. 빨리 해보고 싶었던 마음을 들은 뒤, 기울어진 탑과 차곡이의 표정을 다시 보며 어떤 일이 일어났는지 물어보세요. 블록을 돌려주거나 다음 차례를 부탁하는 장면으로 다시 시작할 수 있습니다.']},

 beaver:{scene:'블록을 모두 갖고 싶었던 마음이 함께 다리를 만드는 일과 부딪힙니다. 주인공이 긴 판의 양쪽을 혼자 잡으려 하자 한쪽이 내려앉고, 이음이는 옆에서 그 모습을 지켜봅니다. 혼자 하려던 시도가 어려워진 뒤에야 도움과 역할을 다시 생각하게 됩니다.',bridge:'동화에서는 완성된 다리보다, 다리가 기울어진 뒤 주인공이 무엇을 바꾸는지에 초점을 둡니다. 도움을 부탁하거나 양쪽 끝을 하나씩 맡는 선택을 통해 “함께한다”는 말을 손으로 해볼 수 있는 행동으로 옮깁니다.',practice:'정리나 만들기처럼 둘이 함께할 일을 하나 골라보세요. 어른이 역할을 바로 나누어 주기 전에 아이에게 어느 부분을 맡고 싶은지, 어떤 부분은 같이하면 좋을지 물어보면 동화에서 고른 방법을 실제로 써볼 수 있습니다.',question:'“내가 맡을 일과 같이하고 싶은 일은 무엇일까?”',branches:['양쪽 끝을 나누어 잡는 답변을 골랐습니다. 함께할 일을 작은 역할로 나누어 생각한 선택입니다. 다음에는 누가 어느 쪽을 잡을지 말로 정하고, 서로 준비되었는지 확인한 뒤 움직이는 장면까지 이어가 보세요.','도움을 부탁하는 답변을 골랐습니다. “도와줘”에서 한 걸음 더 나아가 어떤 부분을 함께 잡아주면 좋을지 구체적으로 말해볼 수 있습니다. 도움을 받은 뒤에는 둘의 움직임이 어떻게 달라졌는지 아이가 설명하도록 기다려주세요.','혼자 모두 해보겠다는 답변을 골랐습니다. 스스로 하고 싶었던 마음을 먼저 들은 뒤, 다리가 기울어진 이유를 그림에서 찾아보세요. 한쪽을 친구에게 맡겨 다시 해보는 장면과 비교하면 도움을 받는 순간을 부담 없이 이야기할 수 있습니다.']},
 lion:{scene:'씨앗을 심은 뒤 바로 새싹을 보고 싶은 마음을 다룹니다. 주인공이 흙을 파 보자 씨앗이 밖으로 나오고, 손을 멈춘 채 다시 덮어주고 싶어집니다. 조급했던 행동을 돌아본 뒤 씨앗에게 필요한 시간과 돌봄을 다시 생각합니다.',bridge:'동화의 기다림은 아무것도 하지 않고 참는 일로만 그려지지 않습니다. 물을 주는 일, 잠시 다른 놀이를 하는 일, 흙을 다시 덮어주는 일을 통해 기다리는 동안 할 수 있는 행동을 찾아봅니다.',practice:'아이와 기르고 있는 식물이나 완성까지 시간이 걸리는 일을 하나 떠올려 보세요. 결과를 확인하는 횟수를 세기보다 오늘 내가 해줄 수 있는 일이 무엇인지 정하고, 달라진 모습을 발견했을 때 함께 이야기해보면 좋겠습니다.',question:'“아직 달라지지 않았을 때 오늘 내가 해줄 수 있는 일은 뭘까?”',branches:['물을 주며 기다리겠다는 답변을 골랐습니다. 기다리는 동안 이어갈 돌봄을 선택했습니다. 한 번에 많이 하기보다 필요한 만큼 해주고 다시 살펴보는 순서를 아이의 말로 정해보세요.','다른 놀이를 하며 기다리겠다는 답변을 골랐습니다. 기다림에서 잠깐 떨어져 다른 즐거움을 찾는 방법입니다. 언제 다시 돌아와 살펴볼지 아이와 약속하면 잊어버리는 것과 잠시 쉬는 것을 구분해 볼 수 있습니다.','씨앗을 꺼내 확인하고 싶다는 답변을 골랐습니다. 보이지 않는 변화가 궁금했던 마음을 들은 뒤, 씨앗을 꺼내면 어떤 일이 생길지 함께 생각해보세요. 흙을 덮고 기다리는 장면으로 돌아가 다른 확인 방법을 찾아볼 수 있습니다.']},
 rabbit:{scene:'공을 잃어버린 귀담이가 이야기를 하고 싶은데, 주인공은 자기 말과 재미있는 놀이를 먼저 꺼냅니다. 친구의 표정은 쉽게 밝아지지 않고 대화도 엇갈립니다. 주인공은 말을 멈춘 뒤 귀담이에게 필요한 것이 무엇인지 다시 살펴봅니다.',bridge:'동화에서는 친구를 빨리 기쁘게 만드는 것보다 친구가 말하려는 내용을 듣는 과정을 길게 보여줍니다. 이야기를 듣기, 함께 찾겠다고 말하기, 재미있는 말을 잠시 멈추기가 어떻게 다른지 비교할 수 있습니다.',practice:'아이와 하루를 이야기할 때 답을 바로 제안하기 전에 아이의 말을 한 번 더 들어보세요. 동화 속 귀담이에게 했던 말 가운데 실제 친구에게도 해보고 싶은 말을 고르면 이야기와 일상 대화가 연결됩니다.',question:'“친구가 아직 하고 싶은 말이 있다면 어떻게 알아볼까?”',branches:['친구의 이야기를 듣는 답변을 골랐습니다. 무슨 일이 있었는지 듣고 친구의 말이 끝났는지 확인하는 대화로 이어갈 수 있습니다. 들은 내용 가운데 가장 마음에 남은 말을 아이가 다시 말해보도록 해보세요.','함께 공을 찾겠다는 답변을 골랐습니다. 친구를 도울 구체적인 일을 떠올렸습니다. 찾기를 시작하기 전에 어디에서 마지막으로 보았는지, 친구가 먼저 이야기하고 싶은 것은 없는지 물어보는 장면도 함께 생각해보세요.','재미있는 이야기로 웃게 하겠다는 답변을 골랐습니다. 친구가 다시 기뻤으면 하는 마음을 먼저 듣고, 아직 공 이야기를 하고 싶어 하는 표정을 다시 살펴보세요. 웃기는 말을 잠시 멈추고 친구의 말을 기다리는 선택과 비교할 수 있습니다.']},
 hedgehog:{scene:'발을 삐끗한 고요와 계속 공놀이를 하고 싶은 마음을 다룹니다. 주인공은 평소처럼 공을 들고 먼저 달려가지만 고요는 따라오지 못합니다. 멀어진 친구를 보고 돌아와, 둘이 함께할 수 있는 속도와 놀이 방법을 다시 찾습니다.',bridge:'동화에서는 친구를 위해 놀이를 모두 포기하는 대신 방법을 바꿔 함께하는 장면을 보여줍니다. 앉아서 공을 굴리거나 잠깐 쉬는 선택을 통해 친구의 상태를 묻고 조율하는 과정을 연습할 수 있습니다.',practice:'함께 노는 사람의 속도나 하고 싶은 일이 다를 때 아이에게 놀이 방법을 제안해 달라고 해보세요. 어른이 대신 결론을 내리기보다 “이 방법이면 둘 다 할 수 있을까?”라고 묻고 실제로 짧게 해보면 좋겠습니다.',question:'“친구도 편하게 함께하려면 놀이를 어떻게 바꿀까?”',branches:['앉아서 공을 굴리는 답변을 골랐습니다. 친구의 상태에 맞추어 놀이 방법을 바꾸는 선택입니다. 새로운 방법이 친구에게도 괜찮은지 먼저 묻고 함께 시작하는 장면까지 이어가 보세요.','괜찮은지 물어보고 쉬는 답변을 골랐습니다. 친구의 말을 듣는 일을 놀이보다 먼저 놓았습니다. 얼마나 쉬고 싶은지, 쉬는 동안 함께 무엇을 하면 좋을지 아이와 구체적으로 이야기할 수 있습니다.','먼저 달려가서 기다리는 답변을 골랐습니다. 같이 놀고 싶은 마음과 친구가 따라오기 어려운 상황을 나누어 살펴보세요. 멀어진 뒤 기다리는 방법과 곁에서 속도를 맞추는 방법을 그림으로 비교해 볼 수 있습니다.']},
 turtle_breath:{scene:'함께 쌓던 블록 탑이 무너지자 마음이 뜨거워지는 장면을 다룹니다. 주인공은 서둘러 다시 쌓지만 블록이 또 미끄러지고, 손에 힘이 들어간 자신의 모습을 알아차립니다. 잠깐 멈춘 뒤에야 차곡이와 다시 시작할 방법을 생각합니다.',bridge:'동화는 화가 나지 않아야 한다고 요구하기보다 화가 난 뒤의 다음 행동을 보여줍니다. 손을 멈추기, 숨을 고르기, 속상한 이유를 말하기가 다시 놀이를 시작하는 과정과 이어집니다.',practice:'일기 속에 놀이가 뜻대로 되지 않았던 장면이 있다면, 그때 몸과 손이 어땠는지 아이와 이야기해보세요. 다음에 비슷한 일이 생기면 사용할 짧은 말이나 행동을 하나 정하고 함께 해보면 좋겠습니다.',question:'“마음이 뜨거워질 때 내 손은 무엇을 하고 있었을까?”',branches:['천천히 숨을 쉬는 답변을 골랐습니다. 숨을 쉰 뒤 바로 잘되기를 기대하기보다 다시 블록을 잡을 준비가 되었는지 아이에게 물어보세요. 멈춤과 다시 시작하기 사이의 변화를 말로 들어볼 수 있습니다.','속상한 마음을 말하는 답변을 골랐습니다. 무너진 탑 때문에 어떤 마음이 들었는지 말한 뒤, 친구에게 바라는 도움도 덧붙여 볼 수 있습니다. 아이가 사용한 감정 말을 그대로 받아 대화를 이어가 보세요.','블록을 밀어버리고 싶은 답변을 골랐습니다. 힘이 들어간 손과 흩어진 블록을 함께 보며 그 다음에 어떤 일이 생길지 물어보세요. 손을 무릎에 놓거나 잠깐 떨어져 쉬는 다른 시작을 함께 해볼 수 있습니다.']},
 elephant_help:{scene:'함께 그림을 그리고 싶지만 필요한 물감이 높은 곳에 있는 상황을 다룹니다. 주인공이 혼자 손을 뻗다가 붓을 건드리고, 붓은 탁자 아래로 굴러갑니다. 잠깐 멈추고 품이에게 어떤 도움을 부탁할지 생각합니다.',bridge:'동화에서는 부탁을 말하는 장면을 짧게 지나가지 않습니다. 무엇이 필요한지 알아차린 뒤 상대가 해줄 수 있는 일을 구체적으로 말하고, 함께 방법을 찾는 과정을 보여줍니다.',practice:'아이가 손이 닿지 않는 물건을 꺼내거나 어려운 만들기를 할 때 어떤 도움이 필요한지 직접 말할 기회를 주세요. “어느 부분을 같이하면 좋을까?”라는 질문 뒤에 아이의 부탁을 기다려보면 좋겠습니다.',question:'“품이에게 어떤 도움을 부탁하면 내 마음이 잘 전해질까?”',branches:['물감을 꺼내 달라고 부탁하는 답변을 골랐습니다. 필요한 물건과 바라는 행동을 구체적으로 말했습니다. 일상에서도 “도와줘” 뒤에 무엇을 함께 해주면 좋을지 한 문장 더 붙여볼 수 있습니다.','함께 방법을 찾는 답변을 골랐습니다. 친구와 해결 방법을 생각하는 선택입니다. 여러 방법 중 둘이 안전하고 편하게 할 수 있는 방법이 무엇인지 아이가 설명하도록 기다려주세요.','혼자 계속 손을 뻗는 답변을 골랐습니다. 스스로 해보고 싶었던 마음을 듣고, 어느 순간 도움을 부탁하면 좋을지 그림을 다시 보며 이야기해보세요. 부탁한다고 내가 하고 싶은 일이 사라지는 것은 아니라는 점을 행동으로 확인할 수 있습니다.']},
 beaver_train:{scene:'서로 다른 방향으로 기차길을 만들다가 길이 이어지지 않는 상황을 다룹니다. 주인공은 자기 쪽 선로를 서둘러 밀어 붙이지만 끝이 어긋나 기차가 멈춥니다. 이음이의 길을 바라본 뒤 함께 연결할 위치와 역할을 다시 정합니다.',bridge:'동화는 혼자 만든 길을 잘못된 결과로만 다루지 않고, 서로의 길을 어떻게 이어갈지 생각하게 합니다. 양쪽을 잡기, 필요한 도움을 말하기, 길 조각을 나누기가 공동의 목표와 연결됩니다.',practice:'아이와 길이나 탑처럼 함께 만드는 놀이를 해보세요. 각자 만든 부분을 바로 고치기보다 어디를 이어야 할지 가리켜 보고, 누가 어느 부분을 맡으면 좋을지 아이와 정해보면 좋겠습니다.',question:'“서로 만든 길을 잇기 위해 먼저 무엇을 맞춰볼까?”',branches:['양쪽 끝을 함께 잡는 답변을 골랐습니다. 서로 준비한 부분을 하나로 연결하려는 선택입니다. 움직이기 전에 어디에 놓을지 말하고 같은 속도로 내려놓는 과정까지 함께 해보세요.','도움을 부탁하는 답변을 골랐습니다. 어떤 부분을 함께 잡아주면 좋을지 구체적인 말로 바꾸어 볼 수 있습니다. 도움을 받은 뒤 두 길이 어떻게 달라졌는지 아이가 설명하도록 기다려주세요.','혼자 모든 길을 만들고 싶다는 답변을 골랐습니다. 내 길을 완성하고 싶은 마음과 친구가 만든 길을 함께 살펴보세요. 조각을 나누어 갖고 서로 이어 보는 다른 방법을 짧게 해볼 수 있습니다.']},
 lion_puzzle:{scene:'마지막 퍼즐 조각이 맞지 않아 그만하고 싶은 장면을 다룹니다. 주인공은 같은 방향으로 계속 밀어보지만 조각은 들어가지 않습니다. 어긋난 자리를 보며 잠시 멈춘 뒤, 모양을 돌려 보거나 소리와 함께 살필 방법을 생각합니다.',bridge:'동화에서 다시 한다는 것은 같은 힘으로 더 오래 미는 일이 아닙니다. 모양을 살피기, 조각을 돌리기, 잠깐 쉬었다가 친구와 보기처럼 방법을 바꾸는 과정을 비교할 수 있습니다.',practice:'아이에게 익숙한 퍼즐이나 만들기 한 부분을 함께 골라보세요. 어려워할 때 정답 위치를 바로 알려주기보다 이미 해본 방법과 다음에 바꿔볼 것을 아이가 말하도록 기다려보면 좋겠습니다.',question:'“같은 방법이 잘되지 않을 때 무엇을 조금 바꿔볼까?”',branches:['조각을 돌려 보는 답변을 골랐습니다. 힘을 더 주는 대신 모양과 방향을 바꾸어 살피는 선택입니다. 무엇을 보고 방향을 바꾸었는지 아이의 설명을 들어보면 과정이 더 분명해집니다.','쉬었다가 함께 살펴보는 답변을 골랐습니다. 잠깐 멈춘 뒤 다시 시작하는 방법입니다. 쉬는 동안 무엇이 달라졌는지, 친구와 보면 어떤 부분을 더 볼 수 있는지 이야기해보세요.','퍼즐을 밀어내거나 그만두고 싶은 답변을 골랐습니다. 어렵고 답답했던 부분을 먼저 듣고, 다시 하고 싶어질 때 고를 수 있는 방법을 하나 남겨두세요. 지금 멈추는 것과 다시 시작할 길을 함께 이야기할 수 있습니다.']},
 rabbit_rain:{scene:'소풍이 끝나 아쉬운 귀담이와 비 오는 숲길을 걷는 상황을 다룹니다. 주인공이 우산을 들고 먼저 가자 귀담이는 뒤에 남고 대화도 끊깁니다. 멀어진 친구를 본 뒤 돌아와, 친구가 말하고 싶은 마음과 함께 걷는 방법을 다시 생각합니다.',bridge:'동화에서는 친구를 데리고 빨리 이동하는 일과 친구의 아쉬움을 듣는 일이 구분됩니다. 걸음을 멈추고 표정을 살피기, 우산을 함께 쓰기, 끝난 소풍에 대해 이야기하기가 한 흐름으로 이어집니다.',practice:'즐거운 활동을 마치고 돌아오는 길에 아이가 아쉬워한다면, 다음 활동을 바로 제안하기 전에 오늘 더 하고 싶었던 일을 들어보세요. 동화 속 귀담이에게 했던 말을 아이 자신의 아쉬움에도 써볼 수 있습니다.',question:'“친구가 아쉬워할 때 어떤 이야기를 더 들어주고 싶어?”',branches:['친구의 아쉬운 마음을 듣는 답변을 골랐습니다. 무엇이 가장 즐거웠고 무엇을 더 하고 싶었는지 한 번 더 물어볼 수 있습니다. 바로 기분을 바꾸려 하기보다 친구의 말이 이어질 시간을 주는 대화입니다.','우산을 함께 쓰는 답변을 골랐습니다. 친구가 곁에서 편하게 걷도록 돕는 선택입니다. 우산 안으로 들어온 뒤에도 귀담이가 하고 싶었던 말을 듣는 장면까지 이어가 보세요.','먼저 걸어가는 답변을 골랐습니다. 빨리 가고 싶은 내 마음과 뒤에 남은 친구의 표정을 함께 보세요. 돌아와 속도를 맞추고 아쉬웠던 일을 물어보는 다른 방법과 비교할 수 있습니다.']},
 hedgehog_turn:{scene:'시소를 더 타고 싶은 주인공 곁에서 고요가 기다리는 장면을 다룹니다. 혼자 놀이를 이어가다 보니 시소가 뜻대로 움직이지 않고 친구는 놀이에 들어오지 못합니다. 주인공은 기다리던 친구를 본 뒤 함께 즐길 자리를 다시 생각합니다.',bridge:'동화에서는 차례를 양보하라는 말 하나로 끝내지 않고, 친구가 무엇을 하고 싶은지 묻고 함께 탈 방법을 찾습니다. 내 즐거움과 친구의 즐거움이 모두 이어질 수 있는 방법을 비교합니다.',practice:'하나의 놀잇감을 함께 쓰는 순간에 아이에게 두 사람이 즐길 방법을 생각해 달라고 해보세요. 시간을 바로 정해주는 대신 아이가 먼저 제안한 방법을 해보고, 친구도 괜찮은지 확인하면 좋겠습니다.',question:'“내가 더 하고 싶을 때 친구도 함께하려면 어떻게 할까?”',branches:['함께 마주 앉아 타는 답변을 골랐습니다. 놀잇감을 나누는 것에서 함께 움직이는 놀이로 방법을 바꾸었습니다. 서로 준비되었는지 묻고 천천히 시작하는 장면까지 해볼 수 있습니다.','친구가 하고 싶은 일을 묻는 답변을 골랐습니다. 내가 예상한 답과 친구가 직접 말한 답이 같은지 들어보는 과정입니다. 들은 제안을 함께 해본 뒤 둘 다 괜찮았는지 다시 물어보세요.','혼자 조금 더 타는 답변을 골랐습니다. 더 하고 싶은 마음을 듣고 기다리는 친구에게 무엇을 알려주면 좋을지 생각해보세요. 다음 차례를 약속하거나 함께 탈 자리를 만드는 방법을 비교할 수 있습니다.']}
};
function diaryEntry18(storyId){const entry=diaryEntries18[storyId];return entry?{...entry}:null;}
function validDiaryDate18(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value+'T12:00:00Z'))&&new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value;}
try{
 const stored=JSON.parse(localStorage.getItem(diaryStorageKey18)||'null');
 if(stored?.version===18&&stored.entries&&typeof stored.entries==='object')for(const [id,value]of Object.entries(stored.entries)){
  if(!stories.some(story=>story.id===id)||!value||typeof value.text!=='string'||!value.text.trim())continue;
  diaryEntries18[id]={text:value.text.trim().slice(0,3000),moment:typeof value.moment==='string'?value.moment.trim().slice(0,300):'',date:validDiaryDate18(value.date)?value.date:'',updatedAt:typeof value.updatedAt==='string'?value.updatedAt:''};
 }
}catch(_){}

const exampleDiaries20=[{"id":"turn","title":"내 차례를 기다리는 동안","theme":"turtle","text":"하원길에 오늘 블록 탑을 만들었다는 이야기를 들었다. 친구가 블록을 고르는 동안 자기도 빨리 놓고 싶어서 손이 먼저 나갔다고 했다. 집에서도 이야기를 하다가 내 말을 기다리지 못하고 끼어들었는데, 곧 ‘엄마 말 끝나면 내가 말할게’라고 덧붙였다. 참으라고 말하기보다 하고 싶은 마음을 먼저 들어주고, 기다리는 동안 무엇을 하면 편할지 함께 생각해봤다. 손을 무릎에 올려두거나 다음에 쓸 블록을 골라두는 방법 중 아이가 편한 것을 찾아보면 좋겠다.","childWords":"나도 빨리 놓고 싶었어. 다음에는 내 차례라고 알려줘.","moment":"친구 차례가 끝나기 전에 손이 먼저 나갔지만, 기다릴 방법을 다시 고른 순간","noticeTitle":"블록 탑을 함께 쌓았어요","noticeText":"오늘 자유놀이 시간에 친구와 블록 탑을 만들었습니다. 친구 차례에 먼저 블록을 놓으려는 모습이 있었지만, 교사가 차례를 알려주자 옆에서 다음 블록을 골라 기다렸습니다. 자기 차례가 오자 친구에게 ‘이제 내가 놓을게’라고 말하며 놀이를 이어갔습니다. 가정에서도 하고 싶은 마음을 말한 뒤 상대의 차례를 기다려보는 경험을 함께 나눠주세요."},{"id":"feelings","title":"속상한 마음을 말로 꺼낸 날","theme":"elephant","text":"아이가 유치원에서 오래 만든 블록 성이 무너졌다고 했다. 처음에는 아무 말 없이 신발만 만지작거려서 바로 묻지 않고 곁에 앉아 기다렸다. 조금 뒤 ‘다시 만들기 싫었어’라고 말했고, 잘 만들고 싶었던 만큼 속상했겠다고 이야기해줬다. 집에서 작은 성을 만들다 무너지자 이번에는 ‘지금 속상해. 잠깐 기다려줘’라고 말했다. 금방 기분을 풀어주기보다 아이가 자신의 마음과 필요한 도움을 직접 말할 수 있도록 기다려준 순간을 기억하고 싶다.","childWords":"지금 속상해. 잠깐 기다려줘.","moment":"말없이 고개를 숙이고 있다가 속상한 마음과 필요한 시간을 직접 말한 순간","noticeTitle":"무너진 성 앞에서 마음을 이야기했어요","noticeText":"블록으로 만든 성이 무너지자 한동안 놀이를 멈추고 조용히 앉아 있었습니다. 옆에서 기다리며 마음을 물어보니 ‘속상해요’라고 표현했습니다. 잠깐 쉰 뒤 친구와 낮은 성부터 다시 쌓기로 했습니다. 말하기까지 시간이 필요할 때도 있으니, 표현을 서두르게 하기보다 편하게 말할 수 있도록 기다려주세요."},{"id":"together","title":"긴 기차길을 같이 이은 날","theme":"beaver","text":"오늘 알림장에서 친구와 기차길을 연결했다는 소식을 읽었다. 집에서 물어보니 처음에는 길 조각을 자기가 모두 쓰고 싶었다고 했다. 서로 다른 방향으로 만든 길이 이어지지 않자 친구에게 ‘여기를 같이 잡아줄래?’라고 말했다고 한다. 저녁에 함께 기차길을 만들 때도 내 쪽을 정해주기보다 어느 부분을 맡고 싶은지 먼저 물었다. 아이는 자기가 굽은 길을 만들고 나는 긴 길을 만들면 좋겠다고 했다. 혼자 완성하는 것보다 서로의 생각을 듣고 연결하는 과정을 동화에서 다시 만나보면 좋겠다.","childWords":"이쪽을 같이 잡아줄래? 그러면 기차가 끝까지 갈 수 있어.","moment":"혼자 길 조각을 모으던 아이가 친구에게 맡길 부분을 말하고 서로의 길을 연결한 순간","noticeTitle":"친구와 역할을 나누어 기차길을 만들었어요","noticeText":"기차길을 만드는 놀이에서 길 조각을 많이 갖고 싶어 했습니다. 각자 만든 길이 연결되지 않자 친구의 길을 바라보고 연결할 자리를 함께 찾아보았습니다. 긴 길 조각은 양쪽 끝을 하나씩 잡아 옮겼고, 누가 어느 부분을 만들지 말로 정하며 놀이를 마쳤습니다. 역할을 나누기 전에 서로 하고 싶은 일을 들어보는 과정이 의미 있었습니다."},{"id":"listen","title":"친구의 속상한 이야기를 들은 날","theme":"rabbit","text":"친구가 아끼는 공을 잃어버려서 속상해했다는 이야기를 들었다. 아이는 처음에 웃긴 말을 해주면 친구가 웃을 줄 알았다고 했다. 그런데 친구가 계속 공 이야기를 하자 자기 말을 멈추고 어디에서 마지막으로 봤는지 물었다고 한다. 집에서도 내가 물건을 찾고 있을 때 ‘그거 소중한 거야?’라고 물어봐 주었다. 바로 괜찮다고 말하거나 해결 방법부터 알려주기보다, 상대가 어떤 마음인지 먼저 듣는 모습을 함께 기억하고 싶다. 친구에게 무엇을 더 물어보고 싶은지 아이와 천천히 이야기해봤다.","childWords":"소중한 공이 없어져서 속상했구나. 어디에서 마지막으로 봤어?","moment":"친구를 빨리 웃게 하려던 말을 멈추고 친구가 하고 싶었던 이야기를 끝까지 들은 순간","noticeTitle":"친구의 이야기를 끝까지 들어주었어요","noticeText":"친구가 공을 찾지 못해 속상해하자 먼저 재미있는 이야기를 꺼냈습니다. 친구가 아직 공 이야기를 하고 싶어 한다는 것을 알고 나서는 말을 멈추고 옆에 앉아 들어주었습니다. 이후 공을 마지막으로 본 곳을 물으며 함께 찾아보았습니다. 친구의 기분을 빨리 바꾸려 하기보다 어떤 마음인지 듣는 경험으로 이어졌습니다."}];
